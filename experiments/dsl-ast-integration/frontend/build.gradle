import de.montigem.gradle.specific.CD2GUITask
import de.montigem.gradle.specific.GUIVariabilityTask
import de.montigem.gradle.specific.UMLP2SymTask
import de.montigem.gradle.specific.merge.MergeTask

plugins {
  id 'java-library'
  id 'de.rwth.se.montigem-frontend'
}

repositories {
  if (("true").equals(getProperty('useLocalRepo'))) {
    mavenLocal()
  }
  maven {
    if (project.hasProperty('mavenUser') && project.hasProperty('mavenPassword')) {
      credentials.username mavenUser
      credentials.password mavenPassword
    }
    url repo
  }

  // native image
  maven { url "https://repo.spring.io/snapshot" }
  maven { url "https://repo.spring.io/milestone" }

  mavenCentral()
}

dependencies {
  implementation("umlp:umlp-rte:${mc_version}")
  srcUMLPConfig(project(":experiments:dsl-ast-integration:backend"))
  testImplementation("com.h2database:h2:${h2_database}")

  implementation group: "de.monticore.lang", name: 'guidsl', version: mc_version
  implementation group: 'org.springframework.boot', name: 'spring-boot-starter-security', version: spring_version

  testImplementation 'org.junit.jupiter:junit-jupiter-api:5.9.2'
  testRuntimeOnly 'org.junit.jupiter:junit-jupiter-engine:5.9.2'
}

def copyTags = tasks.register('copyTags', Copy) {
  from(tasks.named("umlp2sym", UMLP2SymTask).flatMap { it.getOutputDir() }) {
    include '**/*.tags'
  }
  into("$buildDir/tags")
}


umlp2sym {
  enabled = false // instead, we use the symbols from the backend (and thus the merged model!)
}

def cd2gui = tasks.register('cd2gui', CD2GUITask) {
  setGroup('build')
  input.setFrom(project(":experiments:dsl-ast-integration:backend")
      .tasks.named("mergeWithDSL", MergeTask).flatMap { it.outputFile })
  outputDir = layout.buildDirectory.dir("cd2gui")
  dependsOn(copyTags)
}

def guiVariability = tasks.register('guiVariability', GUIVariabilityTask) {
  input.from(cd2gui.flatMap { it.getOutputDir() })
  input.from(file("../models"))
  outputDir = layout.buildDirectory.dir("guiVariability")
}

gui2java {
  guiCreateModelsAsFile = file(cd2gui.flatMap { it.getOutputDir().file("meta/domain/guiCreateTextModels") })
  input.setFrom(guiVariability.flatMap { it.getOutputDir() })
  symbolPath.from(cd2gui.flatMap { it.getOutputDir().file("symbols") })
  symbolPath.from(file("$buildDir/tags"))
  var toExclude = tasks.named("umlp2sym", UMLP2SymTask)
      .flatMap { it.getOutputDir().get().asFile }
  symbolPath.setFrom symbolPath.filter(f -> f != toExclude)
  modelDir.set(file(guiVariability.flatMap { it.getOutputDir() }))
}

umlp2jsweetObserver {
  input.setFrom(guiVariability.flatMap { it.getOutputDir() })
  symbolPath.from(cd2gui.flatMap { it.getOutputDir().file("symbols") })
  symbolPath.from(file("$buildDir/tags"))
  var toExclude = tasks.named("umlp2sym", UMLP2SymTask)
      .flatMap { it.getOutputDir().get().asFile }
  symbolPath.setFrom symbolPath.filter(f -> f != toExclude)
  modelDir.setFrom(file(guiVariability.flatMap { it.getOutputDir() }))
}

npmInstall.args = ['--loglevel', 'error']

test {
  testLogging {
    events "PASSED", "SKIPPED", "FAILED", "STANDARD_OUT", "STANDARD_ERROR"
  }
  useJUnitPlatform()
}
