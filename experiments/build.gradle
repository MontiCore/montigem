subprojects {
  apply plugin: 'jacoco'
  apply plugin: 'java-library'

  jacoco {
    toolVersion = "0.8.12"
  }

  ext.grammarDir = 'src/main/grammars'
  ext.outDir = "${layout.buildDirectory.get().asFile}/generated-sources/monticore/sourcecode"

  dependencies {
    implementation project(':umlp-rte')

    implementation group: 'de.se_rwth.commons', name: 'se-commons-utilities', version: se_commons_version
    testImplementation group: 'org.junit.jupiter', name: 'junit-jupiter-engine', version: junit_version
  }
}

clean.dependsOn(subprojects.collect { it.getTasks().named("clean") })

jar.enabled = false
