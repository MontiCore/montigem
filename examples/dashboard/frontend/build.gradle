import de.montigem.gradle.specific.CreateSymlinkTask
import de.montigem.gradle.specific.GUIJava2TSTask
import de.montigem.gradle.specific.UMLPJava2TSTask

plugins {
  id "de.rwth.se.montigem-frontend"
}

dependencies {
  testImplementation project(':umlp-test-rte')

  // The dashboard module: its domain models, and the symbols and import map of its GUI components
  montigemModuleUMLPModels project(':modules:dashboard')
  montigemModuleUMLPSymbols project(':modules:dashboard')
  montigemModuleGUISymbols project(':modules:dashboard:frontend')
  montigemModuleImportMap project(':modules:dashboard:frontend')
}

configurations {
  testRuntimeClasspath.exclude group: 'de.monticore.language-server', module: 'monticore-language-server-runtime'
}

tasks.named("umlpJava2ts", UMLPJava2TSTask) {
  verbose = true
}

tasks.named("guijava2ts", GUIJava2TSTask) {
  // Resolve the domain classes of the dashboard module (e.g., DashboardModuleConfig)
  symbolPath.from(configurations.montigemModuleUMLPSymbols)
}

// Link the sources of the npm library of the dashboard module (@montigem/dashboard) into the app.
// Workaround: The app is compiled together with the library sources (cf. config/tsconfig*.override.json),
// as the generated code of the app imports the module domain via "dashboardmodule/..." instead of the library.
// Using the built library in addition would result in duplicate classes (e.g., two DashboardModuleManager instances)
def dashboardLib = project(':modules:dashboard:frontend:dashboard')
tasks.named("createSymlink", CreateSymlinkTask) {
  dependsOn dashboardLib.tasks.named("gui2java2ts")
  links.put(layout.buildDirectory.dir("app/libs/@montigem/dashboard").get().asFile,
      dashboardLib.layout.projectDirectory.asFile)
}

test {
  dependsOn buildApp
  useJUnitPlatform() {
    excludeTags "SlowTest"
    excludeTags "Screenshot"
  }
}

tasks.register("slowtest", Test) {
  group = "verification"
  testLogging {
    events "PASSED", "SKIPPED", "FAILED", "STANDARD_OUT", "STANDARD_ERROR"
  }
  useJUnitPlatform {
    includeTags "SlowTest"
  }
  shouldRunAfter test
  dependsOn npmInstall
}

tasks.register("runAppNoBuild", NpxTask) {
  group = "application"
  command = "ng"
  args = ["serve"]
}
