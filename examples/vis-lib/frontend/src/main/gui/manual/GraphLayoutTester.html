<div
    *ngIf="input"
    style="display: flex; flex-wrap: wrap; gap: 25px; padding: 20px; width: 100%; box-sizing: border-box; justify-content: center;"
>
  <div class="test-container" style="width: 850px; height: 160px; border: 1px solid black; position: relative; background: #fff;">
    <div style="position: absolute; top: -18px; left: 5px; font-size: 10px; color: gray;">Standard Desktop (850x160)</div>
    <ng-container *ngTemplateOutlet="input"></ng-container>
  </div>

  <div class="test-container" style="width: 480px; height: 180px; border: 1px solid black; position: relative; background: #fff;">
    <div style="position: absolute; top: -18px; left: 5px; font-size: 10px; color: gray;">Narrow / Text Wrap (480x180)</div>
    <ng-container *ngTemplateOutlet="input"></ng-container>
  </div>

  <div class="test-container" style="width: 95%; min-width: 800px; height: 160px; border: 1px solid black; position: relative; background: #fff;">
    <div style="position: absolute; top: -18px; left: 5px; font-size: 10px; color: gray;">Wide & Flat (95% x 160)</div>
    <ng-container *ngTemplateOutlet="input"></ng-container>
  </div>

  <div class="test-container" style="width: 320px; height: 160px; border: 1px solid black; position: relative; background: #fff;">
    <div style="position: absolute; top: -18px; left: 5px; font-size: 10px; color: gray;">Very Narrow (320x160)</div>
    <ng-container *ngTemplateOutlet="input"></ng-container>
  </div>
</div>
