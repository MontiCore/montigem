import de.montigem.gradle.specific.GUI2Java2TSTask
import de.montigem.gradle.specific.UMLPJava2TSTask

plugins {
  id "de.rwth.se.montigem-frontend"
}

dependencies {
  testImplementation project(':umlp-test-rte')
}

configurations {
  testRuntimeClasspath.exclude group: 'de.monticore.language-server', module: 'monticore-language-server-runtime'
}

tasks.named("umlpJava2ts", UMLPJava2TSTask) {
  verbose = true
}

tasks.named("gui2java2ts", GUI2Java2TSTask) {
  guiCreateModels = ["person.CreatePerson", "person.CreatePersonWithFriends", "person.CreateClubWithMembers"]
  verbose = true
}

test {
  dependsOn buildApp
  useJUnitPlatform() {
    excludeTags "SlowTest"
    excludeTags "Screenshot"
  }
}

tasks.register("screenshot", Test) {
  dependsOn buildApp
  // the images for comment2doc, declared so that a build cache hit restores them
  outputs.dir("$rootDir/docs/gendoc_img")
  useJUnitPlatform() {
    includeTags "Screenshot"
  }
}

tasks.register("slowtest", Test) {
  group = "verification"
  testLogging {
    events "PASSED", "SKIPPED", "FAILED", "STANDARD_OUT", "STANDARD_ERROR"
  }
  useJUnitPlatform {
    includeTags "SlowTest"
  }
  shouldRunAfter test
  dependsOn npmInstall
}

tasks.register("runAppNoBuild", NpxTask) {
  group = "application"
  command = "ng"
  args = ["serve"]
}

// Task to copy source code to assets for CodeViewer
tasks.register("copySourceCodeToAssets", Copy) {
  group = "build"
  description = "Copies source code (.gui, .java, .scss) to assets for the CodeViewer component"

  from("src/main/gui") {
    include "**/*.gui"
    include "**/*.scss"
  }
  from("src/main/java") {
    include "**/*.java"
  }

  into layout.buildDirectory.dir("app/src/assets/source-code")

  // Ensure the app directory structure exists
  dependsOn "setupFrontend"
}

// Ensure source code is copied when GUI models are synced/generated
tasks.named("sync_gui2java2ts") {
  dependsOn "copySourceCodeToAssets"
}
