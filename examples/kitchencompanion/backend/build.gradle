import de.montigem.gradle.specific.OD2DataTask
import de.montigem.gradle.specific.UMLP2JavaTask

plugins {
  id 'de.rwth.se.montigem-backend'

  id 'com.google.cloud.tools.jib' version '3.4.4'
  // id 'io.spring.dependency-management' version '1.0.15.RELEASE''
  id 'org.springframework.boot' version "${spring_version}"
}

jib {
  container.mainClass = application.mainClass.get()
  from.image = "$container_from_image"
  to.image = "${container_target_image_base}kitchencompanion_backend:latest"
}

dependencies {
  implementation group: 'org.postgresql', name: 'postgresql', version: '42.5.1'
  implementation 'com.h2database:h2:2.1.214'

  // BCrypt only. Deliberately not spring-boot-starter-security, which would auto-configure a filter chain in front of the whole app.
  implementation group: 'org.springframework.security', name: 'spring-security-crypto', version: '6.5.10'

  // Spring Boot Dependencies
  compileOnly group: 'org.springframework.boot', name: 'spring-boot-devtools', version: spring_version
  implementation group: 'org.springframework.boot', name: 'spring-boot-starter-web', version: spring_version
  implementation group: 'org.springframework.boot', name: 'spring-boot-starter-mail', version: spring_version
  implementation group: 'org.springframework.boot', name: 'spring-boot-starter-websocket', version: spring_version
  implementation group: 'org.springframework.boot', name: 'spring-boot-starter-webflux', version: spring_version
  implementation group: 'org.springframework.shell', name: 'spring-shell-starter', version: spring_shell_version
  implementation group: 'org.slf4j', name: 'slf4j-simple', version:  slf4j_version

  compileOnly group: 'org.springframework.boot', name: 'spring-boot-starter-test', version: spring_version
  testImplementation group: 'org.springframework.boot', name: 'spring-boot-starter-test', version: spring_version
  testImplementation 'org.junit.jupiter:junit-jupiter-api:5.9.2'
  testRuntimeOnly 'org.junit.jupiter:junit-jupiter-engine:5.9.2'

  implementation project(':umlp-rte')

  // Mail
  implementation group: 'org.apache.geronimo.javamail', name: 'geronimo-javamail_1.6_mail', version: '1.0.1'
  implementation group: 'com.sun.activation', name: 'javax.activation', version: '1.2.0'

}

def genTestData = tasks.register('genTestData', OD2DataTask) {
  group = "umlp"
  input = file("../models/Example.od")
  outputDir = layout.buildDirectory.dir("testdata")
  handWrittenCodeDir.from(layout.projectDirectory.dir("src/main/java"))
  symbolPath.from(tasks.named("umlp2java", UMLP2JavaTask).map { it.symbolOutDir })
//  symbolOutDir = file("$project.buildDir/testdata/symtab/Examples.odsym")
}

tasks.named("compileJava") {
  dependsOn(genTestData)
}

sourceSets {
  main {
    java.srcDirs += [layout.buildDirectory.dir("testdata")]
  }
}
