import de.montigem.gradle.specific.GUI2JavaTask

plugins {
  id "de.rwth.se.montigem-frontend"
}

dependencies {
  testImplementation "umlp:umlp-tool:$version"
  testImplementation project(':umlp-test-rte')
  testImplementation group: 'org.neo4j.driver', name: 'neo4j-java-driver', version: "$neo4j_java_driver_version"
  testImplementation "org.neo4j.test:neo4j-harness:$neo4j_embedded_test" exclude module: "commons-text"

  // to compile the (playwright=true) AbstractMydomainE2ETest
  def withoutSpringLogging = {
    exclude module: 'spring-boot-starter-logging'
    exclude module: 'logback-classic'
    exclude module: 'log4j-to-slf4j'
  }
  implementation group: 'org.springframework.boot', name: 'spring-boot-starter-test', version: spring_version, withoutSpringLogging
}

def oclTestPageGenerator = project(":examples:it-ocl-test:test-page-generator")
def generatedOclTestPagesDir = layout.buildDirectory.dir("generated/ocl-test-pages/gui")
def generatedOclTestPagesJavaDir = layout.buildDirectory.dir("generated/ocl-test-pages/java")

sourceSets {
  main {
    java.srcDir(generatedOclTestPagesJavaDir)
  }
}

tasks.register("generateOclTestPages", JavaExec) {
  group = "umlp"
  description = "Generates lightweight GUI test pages and button implementations from OCL invariants."

  dependsOn(oclTestPageGenerator.tasks.named("classes"))

  classpath = oclTestPageGenerator.sourceSets.main.runtimeClasspath
  mainClass = "ocl2java.testpagegenerator.OCLTestPageGenerator"

  inputs.files(fileTree("../models/ocl"))
  outputs.dir(generatedOclTestPagesDir)
  outputs.dir(generatedOclTestPagesJavaDir)

  doFirst {
    args = [
        file("../models/ocl").absolutePath,
        generatedOclTestPagesDir.get().asFile.absolutePath,
        generatedOclTestPagesJavaDir.get().asFile.absolutePath
    ]
  }
}

configurations {
  testRuntimeClasspath.exclude group: 'de.monticore.language-server', module: 'monticore-language-server-runtime'
}

tasks.named("gui2java", GUI2JavaTask) {
  dependsOn(tasks.named("generateOclTestPages"))
  input.from(generatedOclTestPagesDir)
  modelDir.from(generatedOclTestPagesDir)
  handWrittenCodeDir.from(generatedOclTestPagesJavaDir)
}

tasks.named("compileJava") {
  dependsOn(tasks.named("generateOclTestPages"))
}

test {
  dependsOn tasks.named("npmInstall"), tasks.named("buildApp")
  // each test JVM starts its own backend and frontend server on free ports
  maxParallelForks = 2
  useJUnitPlatform {
    if (project.hasProperty("tags")) {
      includeTags project.property("tags").toString().split(',')
    }
  }
}
