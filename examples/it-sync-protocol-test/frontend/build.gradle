import de.montigem.gradle.specific.GUIJava2TSTask

plugins {
  id "de.rwth.se.montigem-frontend"
}

dependencies {
  testImplementation project(':umlp-test-rte')
  testImplementation group: 'org.neo4j.driver', name: 'neo4j-java-driver', version: "$neo4j_java_driver_version"
  testImplementation "org.neo4j.test:neo4j-harness:$neo4j_embedded_test" exclude module: "commons-text"

  // to compile the (playwright=true) AbstractMydomainE2ETest
  def withoutSpringLogging = {
    exclude module: 'spring-boot-starter-logging'
    exclude module: 'logback-classic'
    exclude module: 'log4j-to-slf4j'
  }
  implementation group: 'org.springframework.boot', name: 'spring-boot-starter-test', version: spring_version, withoutSpringLogging
}

def syncProtocolTestGenerator = project(":examples:it-sync-protocol-test:sync-protocol-test-generator")
def generatedSyncProtocolTestsDir = layout.buildDirectory.dir("generated/sync-protocol-tests/java")

sourceSets {
  test {
    java.srcDir(generatedSyncProtocolTestsDir)
  }
}

tasks.register("generateSyncProtocolTests", JavaExec) {
  group = "umlp"
  description = "Generates lightweight JUnit tests for the sync protocol."

  dependsOn(syncProtocolTestGenerator.tasks.named("classes"))

  classpath = syncProtocolTestGenerator.sourceSets.main.runtimeClasspath
  mainClass = "syncprotocol.testgenerator.SyncProtocolTestGenerator"

  outputs.dir(generatedSyncProtocolTestsDir)

  doFirst {
    args = [
        generatedSyncProtocolTestsDir.get().asFile.absolutePath
    ]
  }
}

tasks.named("compileTestJava") {
  dependsOn(tasks.named("generateSyncProtocolTests"))
}

test {
  useJUnitPlatform() {
    excludeTags "SlowTest"
  }
}

tasks.register("slowtest", Test) {
  group = "verification"
  testLogging {
    events "PASSED", "SKIPPED", "FAILED", "STANDARD_OUT", "STANDARD_ERROR"
  }
  useJUnitPlatform {
    includeTags "SlowTest"
  }
  shouldRunAfter test
  dependsOn npmInstall
}
