mavenUser=${username}
mavenPassword=${password}
repo=https://nexus.se.rwth-aachen.de/content/groups/umlp
ma_repo=https://nexus.se.rwth-aachen.de/content/groups/montiarc-snapshots

# Container config
container_from_image=registry.git.rwth-aachen.de/monticore/container-registry/eclipse-temurin:21-jre
container_target_image_base=registry.git.rwth-aachen.de/monticore/umlp/

#set true or use \u2013PuseLocalRepo=true to use local maven repo
useLocalRepo=false
# Set true or use -PpublishToLocalNpmRepo=true to publish npm frontend libraries to http://127.0.0.1:4873/
# See devScripts/localNpmRepo for details
publishToLocalNpmRepo=false
useLocalDependencies=true
version=7.9.3-SNAPSHOT

mc_version=7.10.0-SNAPSHOT
ma_version=7.9.0-SNAPSHOT
se_commons_version=7.10.0-SNAPSHOT
ocl_version=7.9.0-SNAPSHOT
junit_version=6.0.3
slf4j_version=2.0.13
guava_version=33.2.1-jre
spring_version=3.5.14
spring_shell_version=3.4.2
h2_database=2.1.214
neo4j_java_driver_version=5.28.5
neo4j_embedded_test=2026.05.0
node_version=24.15.0
playwright_version=1.44.0
jsweet_version=6.3.0
jsweet_transpiler_version=3.2.5-UMLP-SNAPSHOT
elk_version=0.8.1

# Debug Mode allows Breakpoints in UMLPTask. It clashes with "org.gradle.parallel"
de.monticore.gradle.debug=false
org.gradle.parallel=true
org.gradle.caching=true

org.gradle.jvmargs=-Xmx4096m -Dfile.encoding=UTF-8
