import de.mclsg.TaskTypes
import de.mclsg.task.AutoconfigureTask

/* (c) https://github.com/MontiCore/monticore */

plugins {
  id 'java'
  id 'jacoco'
  id 'maven-publish'
  id 'de.monticore.generator' version "$mc_version"
  id 'com.gradleup.shadow' version "$shadow_plugin_version"
  id 'de.monticore.language-server' version "$mclsg_version"
  id 'de.monticore.language-server-vscode' version "$mclsg_version" apply(false)
  id "io.github.themrmilchmann.ecj" version "0.2.0"
}

def shouldBuildVscodePlugin = ("true").equals(getProperty('buildVscodePlugin'))

if(shouldBuildVscodePlugin) {
  apply plugin: "de.monticore.language-server-vscode"
}

jacoco{
  toolVersion = "0.8.12"
}

ecj {
  compilerVersion = "3.43.0"
}

shadowJar {
  manifest {
    attributes 'Main-Class': 'umlp.UMLPTool'
  }
}

java {
  toolchain {
    languageVersion = JavaLanguageVersion.of(21)
  }
}

configurations {
  guiDefaultTypes
  languageServer
}

dependencies {
  implementation group: 'de.monticore.lang', name: 'ocl', version: mc_version
  implementation group: 'de.monticore', name: 'monticore-runtime', version: mc_version
  implementation group: 'de.monticore', name: 'monticore-grammar', version: mc_version
  implementation group: 'de.monticore', name: 'class2mc', version: mc_version
  implementation group: 'de.monticore.lang', name: 'cd4analysis', version: mc_version
  implementation group: 'de.monticore.lang', name: 'cd4analysis', version: mc_version, classifier: 'cdmerge'
  implementation group: 'de.monticore.lang', name: 'guidsl', version: mc_version
  implementation group: 'de.monticore.lang', name: 'cd2gui', version: mc_version
  implementation "de.monticore.language-server:monticore-language-server-runtime:$mclsg_version"
  implementation group: 'de.monticore.lang', name: 'cd4analysis', version: mc_version, classifier: 'language-server'
  implementation group: 'de.se_rwth.commons', name: 'se-commons-gradle', version: se_commons_version
  implementation group: 'de.monticore.lang', name: 'od', version: mc_version
  implementation group: 'de.monticore.lang', name: 'sd-language', version: mc_version
  implementation "org.freemarker:freemarker:$freemarker_version"

  implementation group: "org.yaml", name: "snakeyaml", version: "$snake_yaml_version"

  implementation group: 'jakarta.annotation', name: 'jakarta.annotation-api', version: '2.1.1'
  implementation group: 'jakarta.inject', name: 'jakarta.inject-api', version: '2.0.1'

  implementation group: 'org.jsweet', name: 'jsweet-core', version: "6.3.0"
  implementation(group: 'de.rwth.se.umlp.jsweet', name: 'jsweet-transpiler', version: jsweet_transpiler_version){
    exclude(group: "com.kohlschutter.jdk", module: "standalone-home") // conflict with standalone-jdk21
    exclude(group: "com.kohlschutter.jdk", module: "standalone-jdk11") // replaced with standalone-jdk21
  }

  // LSP dependencies
  implementation 'org.slf4j:slf4j-api:1.7.7'
  implementation 'ch.qos.logback:logback-classic:1.5.16'
  compileOnly 'org.gradle:gradle-tooling-api:7.6'
  testImplementation 'org.gradle:gradle-tooling-api:7.6'
  languageServer 'org.gradle:gradle-tooling-api:7.6'

  testImplementation "org.junit.jupiter:junit-jupiter-api:$junit_version"
  testImplementation "org.junit.jupiter:junit-jupiter-params:$junit_version"
  testRuntimeOnly "org.junit.jupiter:junit-jupiter-engine:$junit_version"
  testRuntimeOnly "org.junit.platform:junit-platform-launcher:$junit_version"

  testImplementation group: 'com.github.javaparser', name: 'javaparser-symbol-solver-core', version: javaparser_version
  testImplementation group: 'org.mockito', name: 'mockito-core', version: mockito_version

  grammar("de.monticore.lang:cd4analysis:$mc_version")
  grammar("de.monticore:monticore-grammar:$mc_version")
  grammar("de.monticore.lang:guidsl:$mc_version")
  grammar("de.monticore.lang:ocl:$mc_version")

  guiDefaultTypes "de.monticore.lang:guidsl:$mc_version:default-types"
}

group = 'umlp'
repositories {
  if (("true").equals(getProperty('useLocalRepo'))) {
    mavenLocal()
  }
  maven {
    if (project.hasProperty('mavenUser') && project.hasProperty('mavenPassword')) {
      credentials.username mavenUser
      credentials.password mavenPassword
    }
    url repo
  }
  mavenCentral()
  maven {
    url = "https://repo.gradle.org/gradle/libs-releases/"
  }
 }

test {
  systemProperty 'guidsl-default-types', configurations.guiDefaultTypes.asPath
  useJUnitPlatform()
  finalizedBy jacocoTestReport
}

jacocoTestReport{
  dependsOn test
  reports{
    xml.required = false
    html.required = true
    csv.required = true
  }

  def classesDirProvider =  layout.buildDirectory.dir("classes/java/main")
  def srcDirProvider = layout.projectDirectory.dir("src/main/java")

  classDirectories.setFrom(files(classesDirProvider).asFileTree.matching({
    def javaSources = fileTree(srcDirProvider).matching{
      include "**/*.java"
    }
    def includesList = javaSources.files.collect { file ->
      def relPath = srcDirProvider.asFile.toPath().relativize(file.toPath()).toString()
      return relPath.replaceAll(/\.java$/, '').replace('\\', '/')
    }.collectMany {name -> ["${name}.class", "${name}\$*.class"] }

    include includesList
  }))

  sourceDirectories.setFrom(srcDirProvider)
}

description = 'UML/P Language and Tool'

compileJava {
  dependsOn project.collect { it.tasks.withType(MCTask) }
  options.warnings = false
}

//can not be registered lazy because then everything breaks
//noinspection ConfigurationAvoidance
task autoconfigure(type: AutoconfigureTask) {
  mclsgAggregation {
    languageAggregationName = "UMLPWithGUI"
    targetPackage = "umlp_with_gui"
    member("UMLP", "umlp", true)
    member("de.monticore.GUIDSL", "gui", false)
    modelPath = ["$projectDir/src/main/grammars"]
    if(shouldBuildVscodePlugin){
      including(TaskTypes.VSCODE_PLUGIN)
    }
  }
}
tasks.build.dependsOn tasks.named('autoconfigure')

packUMLPWithGUILanguageServer{
  exclude("org/apache/log4j/**")
  exclude("jsweet/**")
  exclude("standalone/**")
  exclude("com/kohlschutter/jdk/**")
  // Exclude unused grammars (very conservative, could be done via shadow?)
  exclude("de/monticore/grammar/**")
  exclude("de/monticore/tf/**")
  // Exclude sources
  exclude("**.java")
  from(configurations.languageServer.resolve().collect { project.zipTree(it)})
}

if(shouldBuildVscodePlugin) {
  runUMLPWithGUIVscodePluginAttached {
    def lspWorkDir = project.getProjectDir().toPath().getParent().toAbsolutePath().toString()
    getModelProjectDir().set(lspWorkDir)
    getArgumentProviders().add({["-mup"]} as CommandLineArgumentProvider)
  }
}

///////////////////////// Building Jars //////////////////////////////////

// build sources jar with handwritten + generated sources
tasks.register('sourcesJar', Jar) {
  archiveClassifier = 'sources'
  from(sourceSets.main.allJava)
}

sourcesJar.dependsOn project.collect { it.tasks.withType(MCTask) }
sourcesJar.dependsOn tasks.named('generateUMLPWithGUILanguageServer')

// Caused by mcTask.getHandWrittenCodeDir().setFrom(sourceSet.getJava().getSrcDirs());
// https://github.com/MontiCore/monticore/blob/dev/monticore-generator/src/main/java/de/monticore/gradle/MCGeneratorPlugin.java#L83C7-L83C80
generateMCGrammars.dependsOn tasks.named('generateUMLPWithGUILanguageServer')


shadowJar { // all in one jar
  manifest {
    attributes "Main-Class": "umlp.UMLPTool"
  }
  archiveClassifier = 'cli'
  archiveFileName = "UMLPTool.jar"
  zip64 = true
//        minimize()
  duplicatesStrategy DuplicatesStrategy.INCLUDE
}

jar.dependsOn(sourcesJar)
// jar.dependsOn(shadowJar)

/////////////////////////   Deployment  //////////////////////////////////

// configure deployment
publishing {
  repositories.maven {
    if (project.hasProperty('mavenUser') && project.hasProperty('mavenPassword')) {
      credentials.username mavenUser
      credentials.password mavenPassword
    }

    def releasesRepoUrl = "https://nexus.se.rwth-aachen.de/content/repositories/umlp-releases/"
    def snapshotsRepoUrl = "https://nexus.se.rwth-aachen.de/content/repositories/umlp-snapshots/"
    url = version.endsWith("SNAPSHOT") ? snapshotsRepoUrl : releasesRepoUrl
  }
}

publishing {
  publications {
    maven(MavenPublication) {
      from components.java
    }
  }
}

// TODO: ALu/AHe Enable publishing
if (shouldBuildVscodePlugin && false) {
  // Also upload the LSP vsix (VSCode extension) to the nexus
  publishing {
    publications {
      "buildLSPPublication"(MavenPublication) {
        groupId = "umlp"
        artifactId = "umlp-tool-lsp"
        artifact(tasks.named("packageUMLPWithGUIVscodePlugin").map {
          // only publish the vsix file
          it.outputs.getFiles().filter { it.name.endsWith(".vsix") }.singleFile
        }) {
          builtBy(tasks.named("packageUMLPWithGUIVscodePlugin"))
        }
      }
    }
  }
  // Appears to be necessary, as builtBy is ignored
  tasks.generatePomFileForBuildLSPPublicationPublication.dependsOn(tasks.named("packageUMLPWithGUIVscodePlugin"))
}
