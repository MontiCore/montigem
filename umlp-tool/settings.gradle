pluginManagement {
    repositories {
        if(("true").equals(getProperty('useLocalRepo'))){
            mavenLocal()
        }
        maven {
            if (settings.providers.gradleProperty('mavenUser').present && settings.providers.gradleProperty('mavenPassword').present) {
              credentials.username mavenUser
              credentials.password mavenPassword
            }
            url = repo
        }
        gradlePluginPortal()
        mavenCentral()
    }
}
plugins {
  id 'org.gradle.toolchains.foojay-resolver-convention' version '1.0.0'
}

boolean isCi = System.getenv().containsKey("CI")

String myGetProperty(String key){
  return getProperties().get(key)
}

buildCache {
  local {
    enabled = !isCi // CI has no (persistent) local storage
  }
  remote(HttpBuildCache) {
    enabled = myGetProperty("buildCacheURL") != null
    url = ""+myGetProperty("buildCacheURL")
    allowInsecureProtocol = false
    push = isCi   // Only CI is allowed to push
    credentials {
      username = myGetProperty("buildCacheUser")
      password = myGetProperty("buildCachePassword")
    }
  }
}


rootProject.name = 'umlp-tool'
if(("true").equals(getProperty('buildIntelliJPlugin'))){
  include(":umlp-intellij-plugin")
}

include ":gradle-plugin"
