plugins {
  id 'java-library'
  id 'java-gradle-plugin'
  id 'maven-publish'
}

configurations {
  umlpTool
}

dependencies {
  implementation group: 'de.se_rwth.commons', name: 'se-commons-gradle', version: se_commons_version

  implementation('com.google.cloud.tools:jib-core:0.27.1')
  implementation('javax.inject:javax.inject:1')
  implementation('org.jetbrains:annotations:26.0.1')
  implementation group: 'de.monticore', name: 'monticore-runtime', version: mc_version // for json
  implementation ('org.yaml:snakeyaml:2.2')

  // to setup the gradle-node-plugin
  implementation "com.github.node-gradle:gradle-node-plugin:5.0.0"

  // The following dependencies will be present during compilation & loaded into a separated classloa
  umlpTool group: 'de.monticore.lang', name: 'od', version: mc_version
  umlpTool group: 'de.monticore.lang', name: 'cd4analysis', version: mc_version, classifier: 'cdmerge'
  umlpTool "umlp:umlp-tool:$version"
  umlpTool(group: 'de.rwth.se.umlp.jsweet', name: 'jsweet-transpiler', version: jsweet_transpiler_version){
    exclude(group: "com.kohlschutter.jdk", module: "standalone-home") // conflict with standalone-jdk21
    exclude(group: "com.kohlschutter.jdk", module: "standalone-jdk11") // replaced with standalone-jdk21
  }

  testImplementation "org.junit.jupiter:junit-jupiter-api:$junit_version"
  testImplementation "org.junit.jupiter:junit-jupiter-params:$junit_version"
  testRuntimeOnly "org.junit.jupiter:junit-jupiter-engine:$junit_version"
  testRuntimeOnly "org.junit.platform:junit-platform-launcher:$junit_version"
}

// the UMLPToolOptions file is shared between two projects
// Instead of creating a new super-dependency, we sync/copy the file
tasks.register("syncToolOptions", Sync.class) {
  from('../src/main/java')
  include ('umlp/UMLPToolOptions.java') // only copy UMLPToolOptions.java
  into(project.layout.buildDirectory.dir("syncUMLPToolOptions"))
}
// the config of the local npm registry is shared with devScripts/localNpmRepo (docker)
tasks.register("syncLocalNpmConfig", Sync.class) {
  from('../../devScripts/localNpmRepo/config')
  include ('config.yaml')
  into(project.layout.buildDirectory.dir("syncLocalNpmConfig/localNpmRepo"))
}
["compileJava", "processResources"].forEach {
  tasks.named(it) {
    dependsOn(tasks.named("syncToolOptions"))
  }
}
tasks.named("processResources") {
  dependsOn(tasks.named("syncLocalNpmConfig"))
}

sourceSets {
  main.compileClasspath += configurations.umlpTool
  test.compileClasspath += configurations.umlpTool
  main.resources {
    // include the synced registry config as localNpmRepo/config.yaml
    srcDir(project.layout.buildDirectory.dir("syncLocalNpmConfig"))
  }
  main.java {
    // include the synced ToolOptions class
    srcDir(tasks.named("syncToolOptions"))
  }
}

test {
  useJUnitPlatform()
}

group = 'umlp'
repositories {
  if (("true").equals(getProperty('useLocalRepo'))) {
    mavenLocal()
  }
  maven {
    if (project.hasProperty('mavenUser') && project.hasProperty('mavenPassword')) {
      credentials.username mavenUser
      credentials.password mavenPassword
    }
    url repo
  }
  mavenCentral()
  maven {
    url = "https://repo.gradle.org/gradle/libs-releases/"
  }
  maven {
    url = "https://plugins.gradle.org/m2/"
  }
}


gradlePlugin {
  plugins {
    umlpplugin {
      id = "de.rwth.se.montigem"
      implementationClass = "de.montigem.gradle.MGBasePlugin"
    }
    umlpplugin_dependencies {
      id = "de.rwth.se.montigem-dependencies"
      implementationClass = "de.montigem.gradle.DependencyPlugin"
    }
    umlpplugin_backend {
      id = "de.rwth.se.montigem-backend"
      implementationClass = "de.montigem.gradle.BackendPlugin"
    }
    umlpplugin_backend_test {
      id = "de.rwth.se.montigem-backend-test"
      implementationClass = "de.montigem.gradle.BackendTestPlugin"
    }
    umlpplugin_testing {
      id = "de.rwth.se.montigem-testing"
      implementationClass = "de.montigem.gradle.TestInfrastructurePlugin"
    }
    umlpplugin_frontend {
      id = "de.rwth.se.montigem-frontend"
      implementationClass = "de.montigem.gradle.FrontendPlugin"
    }
    umlpplugin_frontend_test {
      id = "de.rwth.se.montigem-frontend-test"
      implementationClass = "de.montigem.gradle.FrontendTestPlugin"
    }
    umlpplugin_module {
      id = "de.rwth.se.montigem-module"
      implementationClass = "de.montigem.gradle.module.ModulePlugin"
    }
    umlpplugin_module_frontend {
      id = "de.rwth.se.montigem-module-frontend"
      implementationClass = "de.montigem.gradle.module.ModuleFrontendPlugin"
    }
  }
}

tasks.register("buildInfo", de.monticore.gradle.common.MCBuildInfoTask) {
  buildInfoFile = getProjectLayout().getBuildDirectory().file("resources/main/mg3BuildInfo.properties")
  doLast {
    def props = new Properties()
    def file = buildInfoFile.get().asFile
    file.withInputStream { props.load(it) }
    // Also write mc_version to build info
    props.setProperty("mc_version", project.findProperty("mc_version"))
    // no Properties.store: its date comment changes the plugin jar on every build,
    // which invalidates the build cache entries of all generator tasks
    file.text = props.collect { k, v -> "$k=$v" }.sort().join("\n") + "\n"
  }
}
processResources.dependsOn("buildInfo")

// configure deployment
publishing {
  repositories.maven {
    if (project.hasProperty('mavenUser') && project.hasProperty('mavenPassword')) {
      credentials.username mavenUser
      credentials.password mavenPassword
    }

    def releasesRepoUrl = "https://nexus.se.rwth-aachen.de/content/repositories/umlp-releases/"
    def snapshotsRepoUrl = "https://nexus.se.rwth-aachen.de/content/repositories/umlp-snapshots/"
    url = version.endsWith("SNAPSHOT") ? snapshotsRepoUrl : releasesRepoUrl
  }
}
