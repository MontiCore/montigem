plugins {
  id 'java'
  id 'de.monticore.language-server' version "$mclsg_version"
  id "org.jetbrains.intellij.platform" version "2.6.0"
}

import org.jetbrains.intellij.platform.gradle.TestFrameworkType

def shouldBuildIntelliJPlugin = ("true").equals(getProperty('buildIntelliJPlugin'))

java {
  toolchain {
    languageVersion = JavaLanguageVersion.of(21)
  }
}

sourceSets {
  main {
    java {
      srcDir("build/generated-sources/UMLPWithGUI/plugins/umlpwithgui-intellij-plugin/src/main/java")
    }
    resources {
      srcDir("build/generated-sources/UMLPWithGUI/plugins/umlpwithgui-intellij-plugin/src/main/resources")
    }
  }
}

repositories {
  if (("true").equals(getProperty('useLocalRepo'))) {
    mavenLocal()
  }
  maven {
    if (project.hasProperty('mavenUser') && project.hasProperty('mavenPassword')) {
      credentials.username mavenUser
      credentials.password mavenPassword
    }
    url repo
  }
  mavenCentral()
  intellijPlatform {
    defaultRepositories()
  }
}

def languageServerJarFile = parent.tasks.packUMLPWithGUILanguageServer.getArchiveFile().get().getAsFile()

dependencies {
  implementation "de.monticore.language-server.plugin:monticore-language-server-runtime-intellij:$mclsg_version"

  testImplementation "de.monticore.language-server.plugin:monticore-language-server-runtime-intellij-test:$mclsg_version"

  // Standard JUnit 5 dependencies
  testImplementation "org.junit.jupiter:junit-jupiter:$junit_version"
  testRuntimeOnly "org.junit.platform:junit-platform-launcher:$junit_version"

  intellijPlatform {
    intellijIdeaCommunity("2024.2")
    plugins(["com.redhat.devtools.lsp4ij:0.18.0"])
    testFramework(TestFrameworkType.Platform.INSTANCE)
    testFramework(TestFrameworkType.Plugin.Java.INSTANCE)
  }
}

test {
  useJUnitPlatform()
}

task initializeIntelliJPlugin(){
  // ignore, workaround for new intellij plugin
}

task autoconfigure(type: de.mclsg.task.AutoconfigureTask) {
  mclsgAggregation {
    languageAggregationName = "UMLPWithGUI"
    targetPackage = "umlp_with_gui"
    member("UMLP", "umlp", true)
    member("de.monticore.GUIDSL", "gui", false)
    modelPath = ["${parent.projectDir}/src/main/grammars"]
    if(shouldBuildIntelliJPlugin) {
      including(de.mclsg.TaskTypes.INTELLIJ_PLUGIN)
    }
    excluding(de.mclsg.TaskTypes.LANGUAGE_SERVER)
    excluding(de.mclsg.TaskTypes.BUILD_INTELLIJ_PLUGIN) // conflicts with "org.jetbrains.intellij.platform"
    languageServerJar(languageServerJarFile)
  }
}

// integrate into plugin
generateUMLPWithGUIIntellijPlugin {
  handCodedDir.set(project.layout.projectDirectory.dir("src/main/java"))
}
patchPluginXml.dependsOn(generateUMLPWithGUIIntellijPlugin) // maybe specific to "org.jetbrains.intellij.platform"
compileJava.dependsOn(generateUMLPWithGUIIntellijPlugin) // replaces intelliJPlugin source set
buildPlugin.dependsOn(prepareSandbox) // weird: this is not set by default, but buildPlugin copies from target folder of prepareSandbox
prepareSandbox {
  // TODO: double copy, we can probably skip copy into generated-sources
  from("build/generated-sources/UMLPWithGUI/plugins/umlpwithgui-intellij-plugin/bin/") {
    into("umlp-intellij-plugin/bin") // based on project name, not generated plugin name!
  }
  dependsOn(copyUMLPWithGUIJarIntoIntellijPlugin)
}
prepareTestSandbox {
  // TODO: double copy, we can probably skip copy into generated-sources
  from("build/generated-sources/UMLPWithGUI/plugins/umlpwithgui-intellij-plugin/bin/") {
    into("umlp-intellij-plugin/bin") // based on project name, not generated plugin name!
  }
  dependsOn(copyUMLPWithGUIJarIntoIntellijPlugin)
}
copyUMLPWithGUIJarIntoIntellijPlugin.dependsOn(parent.tasks.packUMLPWithGUILanguageServer)
tasks.test.dependsOn(copyUMLPWithGUIJarIntoIntellijPlugin)

// config
if(shouldBuildIntelliJPlugin) {
  def lspWorkdir = file("../../").getAbsolutePath()

  runIde {
    args += lspWorkdir
    environment  "LSP_PORT", "3000"
  }

  jar.dependsOn parent.tasks.packUMLPWithGUILanguageServer

  // TODO: can not override default starting behaviour
  task runLsp(type: JavaExec) {
    classpath languageServerJarFile
    mainClass.set("umlp_with_gui._lsp.language_aggregation.UMLPWithGUILanguageAggrServerCLI")
    args("-port", "3000", "-r", "-mp", lspWorkdir, "-mup")
    environment("LSP_SYSTEM_EXIT", "false")
    dependsOn parent.tasks.packUMLPWithGUILanguageServer
  }
}
