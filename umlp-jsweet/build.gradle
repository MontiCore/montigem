/* (c) https://github.com/MontiCore/monticore */
plugins {
  id 'maven-publish'
  id 'java-library'
  id 'jacoco'
}

jacoco{
  toolVersion = "0.8.12"
}

group = "umlp"
description = "UMLP Jsweet Adapters"

repositories {
  if (("true").equals(getProperty('useLocalRepo'))) {
    mavenLocal()
  }
  maven {
    credentials.username mavenUser
    credentials.password mavenPassword
    url repo
  }
}

dependencies {
  // Enable for implementing a new Adapter
  implementation group: 'org.jsweet', name: 'jsweet-core', version: "6.3.0"
  implementation(group: 'de.rwth.se.umlp.jsweet', name: 'jsweet-transpiler', version: jsweet_transpiler_version) {
    exclude(group: "com.kohlschutter.jdk", module: "standalone-home") // conflict with standalone-jdk21
    exclude(group: "com.kohlschutter.jdk", module: "standalone-jdk11") // replaced with standalone-jdk21
  }

  api(group: "com.kohlschutter.jdk.compiler", name:"standalone-jdk21", version: "1.1.3")

  implementation group: 'com.google.guava', name: 'guava', version: guava_version
  implementation group: 'org.slf4j', name: 'slf4j-simple', version: slf4j_version
  implementation group: 'de.se_rwth.commons', name: 'se-commons-logging', version: logging_version

  testRuntimeOnly project(":umlp-rte:backend")
}

sourceSets {
  test {
    java {
      srcDirs = ['src/test/java']
    }
    resources {
      srcDirs = ['src/test/resources']
    }
  }
}

// Task to generate the nodeDir.properties file
tasks.register('addNodePathToTestResources') {
  def outputDir = layout.buildDirectory.dir("generated/test-resources")
  def f = new File(outputDir.get().asFile, "nodeDir.properties")
  outputs.file f

  doLast {
    outputDir.get().asFile.mkdirs()
    if (System.getProperty("os.name").toLowerCase().startsWith("win")) {
      f.text = "node_dir=" + rootProject.getNodeDir().toString().replace("\\", "\\\\")
    } else {
      f.text = "node_dir=" + rootProject.getNodeDir().toString() + "/bin"
    }
  }

}

addNodePathToTestResources.dependsOn rootProject.tasks.named("npmSetup")
processTestResources.dependsOn tasks.addNodePathToTestResources

sourceSets {
  test {
    resources.srcDir layout.buildDirectory.dir("generated/test-resources")
  }
}

test{
  // TestRealTscCompileAndRun invokes the node/npx binaries directly (via nodeDir.properties,
  // same as Util.java); make sure they're actually downloaded and extracted before test
  // execution, not just before the properties file is generated.
  dependsOn rootProject.tasks.named("npmSetup")
  finalizedBy jacocoTestReport
}

jacocoTestReport{
  dependsOn test
  reports{
    xml.required = false
    html.required = true
    csv.required = true
  }

  def classesDirProvider =  layout.buildDirectory.dir("classes/java/main")
  def srcDirProvider = layout.projectDirectory.dir("src/main/java")

  classDirectories.setFrom(files(classesDirProvider).asFileTree.matching({
    def javaSources = fileTree(srcDirProvider).matching{
      include "**/*.java"
    }
    def includesList = javaSources.files.collect { file ->
      def relPath = srcDirProvider.asFile.toPath().relativize(file.toPath()).toString()
      return relPath.replaceAll(/\.java$/, '').replace('\\', '/')
    }.collectMany {name -> ["${name}.class", "${name}\$*.class"] }

    include includesList
  }))

  sourceDirectories.setFrom(srcDirProvider)
}

/////////////////////////   Deployment  //////////////////////////////////

// configure deployment
publishing {
  publications {
    maven(MavenPublication) {
      from(components.java)
    }
  }
  repositories.maven {
    credentials.username mavenUser
    credentials.password mavenPassword

    def releasesRepoUrl = "https://nexus.se.rwth-aachen.de/content/repositories/umlp-releases/"
    def snapshotsRepoUrl = "https://nexus.se.rwth-aachen.de/content/repositories/umlp-snapshots/"
    url = version.endsWith("SNAPSHOT") ? snapshotsRepoUrl : releasesRepoUrl
  }
}
