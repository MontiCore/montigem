# (c) https://github.com/MontiCore/monticore
image: registry.git.rwth-aachen.de/monticore/container-registry/gradle8.14.4-chrome-installed

variables:
  GRADLE_OPTS: "-Dmaven.repo.local=$CI_PROJECT_DIR/.m2"
  GRADLE_USER_HOME: "$CI_PROJECT_DIR/.gradle"
  GRADLE_COMMON_ARGS: "-P mavenPassword=$pass -P mavenUser=$user"
  NPM_CONFIG_CACHE: "$CI_PROJECT_DIR/.npm"
  FF_TIMESTAMPS: true
  PUPPETEER_SKIP_DOWNLOAD: "true"
  CHROME_BIN: "/usr/bin/google-chrome-stable"
  PUPPETEER_EXECUTABLE_PATH: "/usr/bin/google-chrome-stable"

cache:
  paths:
    - .gradle/caches/build-cache-*
    - umlp-tool/.gradle/caches/build-cache-*
    - .npm/_cacache
  key: ${CI_COMMIT_REF_SLUG}

stages:
  - build
  - check
  - testDeployed

gendoc:
  stage: build
  needs:
    - job: build_with_deploy
      artifacts: true
  script:
    - gradle comment2doc:md --refresh-dependencies $GRADLE_COMMON_ARGS
  artifacts:
    paths:
      - docs/gendoc_components
      - docs/gendoc_img
    expire_in: 1 hour
  rules:
    - if: $CI_COMMIT_BRANCH == "dev"
  allow_failure: false

pages:
  stage: build
  needs: ["gendoc"]
  image: registry.git.rwth-aachen.de/monticore/container-registry/mkdocs-image
  rules:
    - if: $CI_COMMIT_BRANCH == "dev"
  script:
    - cp CHANGELOG.md ./docs/.
    - mkdocs build --verbose --clean
    - mv site public
  artifacts:
    paths:
      - public
  allow_failure: true

build_no_containers:
  stage: build
  before_script:
    # Double the Gradle daemon heap for this job only; the checked-in value stays at 4g.
    - sed -i 's/^org.gradle.jvmargs=.*/org.gradle.jvmargs=-Xmx8192m -Dfile.encoding=UTF-8/' gradle.properties
    # The gradle launcher script defaults to -Xmx64m; it buffers all console output and
    # dies with "Java heap space" near the end of the build. JAVA_OPTS only affects the
    # launcher JVM (GRADLE_OPTS is also expanded into the CLI args, so no -Xmx there).
    - export JAVA_OPTS="-Xmx2g"
  script:
    - export CHROME_BIN=/usr/bin/google-chrome-stable
    - "gradle --version 2>&1 | tee $CI_PROJECT_DIR/build.log"
    - "gradle build testCodeCoverageReport umlp-tool:packageUMLPWithGUIVscodePlugin -P buildVscodePlugin=true --refresh-dependencies --stacktrace $GRADLE_COMMON_ARGS $GRADLE_OPTS $ARGS1 >> $CI_PROJECT_DIR/build.log 2> >(tee -a $CI_PROJECT_DIR/build.log >&2)"
    - "mv umlp-tool/build/generated-sources/UMLPWithGUI/plugins/umlpwithgui-vscode-plugin/umlpwithgui-lsp-*.vsix umlp-tool/build/generated-sources/UMLPWithGUI/plugins/umlpwithgui-vscode-plugin/umlpwithgui-lsp.vsix"
    # >(tee -a ...) starts tee background process, wait to ensure everything is written to
    - wait
    # Parse CSV for coverage info
    - awk -F","
      '{ instructions += $4 + $5; covered += $5 } END
      { print covered, "/", instructions, " instructions covered"; print 100*covered/instructions, "% covered" }'
      'build/reports/jacoco/testCodeCoverageReport/testCodeCoverageReport.csv' | tee -a $CI_PROJECT_DIR/build.log
    # Print URI to log file for easier access!
    - echo "Full log -> $CI_PROJECT_URL/-/jobs/$CI_JOB_ID/artifacts/file/build.log"
  coverage: '/\d+.\d+ \% covered/'
  after_script:
    - "cp -r .npm/_logs/ ."
  artifacts:
    when: always
    paths:
      - umlp-tool/umlp-intellij-plugin/build/distributions/**
      - umlp-tool/build/generated-sources/UMLPWithGUI/**/*.vsix
      - ./**/build/reports/tests/test/**
      - build.log
      - ./_logs
      - ./**/build/reports/jacoco/**/*.xml
    reports:
      # Lets gitlab render infos about failed tests
      junit: "**/test/**/TEST-*.xml"
      coverage_report:
        coverage_format: jacoco
        path: build/reports/jacoco/testCodeCoverageReport/testCodeCoverageReport.xml
    expire_in: 1 week
  except:
    refs:
      - dev

build_intellij_plugin:
  stage: build
  script:
    - "cd umlp-tool"
    # MontiGem Template is used for IntelliJ plugin integration tests
    - "git clone https://gitlab-ci-token:${CI_JOB_TOKEN}@git.rwth-aachen.de/monticore/umlp-anwendungen/montigem-templates/montigem-template.git umlp-intellij-plugin/src/test/montigem-template"
    # CI Credentials for Gradle project import
    - "echo mavenUser=$user >> umlp-intellij-plugin/src/test/montigem-template/gradle.properties"
    - "echo mavenPassword=$pass >> umlp-intellij-plugin/src/test/montigem-template/gradle.properties"
    # Make lsp logs accessible for artifacts
    - mkdir "${CI_PROJECT_DIR}/tmpdir"
    - "export _JAVA_OPTIONS=-Djava.io.tmpdir=${CI_PROJECT_DIR}/tmpdir"
    - "gradle :umlp-intellij-plugin:build -P buildIntelliJPlugin=true --info --refresh-dependencies $GRADLE_COMMON_ARGS $GRADLE_OPTS $ARGS1 | tee -a $CI_PROJECT_DIR/build.log"
    - "mv umlp-intellij-plugin/build/distributions/umlp-intellij-plugin-*.zip umlp-intellij-plugin/build/distributions/umlp-intellij-plugin.zip"
  artifacts:
    when: always
    paths:
      - umlp-tool/umlp-intellij-plugin/build/distributions/**
      - build.log
      - tmpdir/**
    reports:
      # Lets gitlab render infos about failed tests
      junit: "**/test/**/TEST-*.xml"
    expire_in: 1 week

build_with_deploy:
  stage: build
  before_script:
    # Double the Gradle daemon heap for this job only; the checked-in value stays at 4g.
    - sed -i 's/^org.gradle.jvmargs=.*/org.gradle.jvmargs=-Xmx8192m -Dfile.encoding=UTF-8/' gradle.properties
  script:
    # Build project + examples + publish RTE, publish generator
    - "gradle --version 2>&1 | tee $CI_PROJECT_DIR/build.log"
    - "gradle build testCodeCoverageReport --refresh-dependencies --stacktrace $GRADLE_COMMON_ARGS $GRADLE_OPTS $ARGS1 $ARGS3 >> $CI_PROJECT_DIR/build.log 2> >(tee -a $CI_PROJECT_DIR/build.log >&2)"
    - "gradle ciDeployRTE ciDeployImages :examples:vis-lib:frontend:screenshot --refresh-dependencies --stacktrace $GRADLE_COMMON_ARGS $GRADLE_OPTS $ARGS1 $ARGS3 >> $CI_PROJECT_DIR/build.log 2> >(tee -a $CI_PROJECT_DIR/build.log >&2)"
    - "gradle :umlp-tool:publish :umlp-tool:gradle-plugin:publish umlp-tool:packageUMLPWithGUIVscodePlugin -P buildVscodePlugin=true $GRADLE_COMMON_ARGS >> $CI_PROJECT_DIR/build.log 2> >(tee -a $CI_PROJECT_DIR/build.log >&2)"
    - "mv umlp-tool/build/generated-sources/UMLPWithGUI/plugins/umlpwithgui-vscode-plugin/umlpwithgui-lsp-*.vsix umlp-tool/build/generated-sources/UMLPWithGUI/plugins/umlpwithgui-vscode-plugin/umlpwithgui-lsp.vsix"
    # >(tee -a ...) starts tee background process, wait to ensure everything is written to
    - wait
    # Parse CSV for coverage info
    - awk -F","
      '{ instructions += $4 + $5; covered += $5 } END
      { print covered, "/", instructions, " instructions covered"; print 100*covered/instructions, "% covered" }'
      'build/reports/jacoco/testCodeCoverageReport/testCodeCoverageReport.csv' | tee -a $CI_PROJECT_DIR/build.log
    # Print URI to log file for easier access!
    - echo "Full log -> $CI_PROJECT_URL/-/jobs/$CI_JOB_ID/artifacts/file/build.log"
  coverage: '/\d+.\d+ \% covered/'
  artifacts:
    when: always
    paths:
      - umlp-tool/umlp-intellij-plugin/build/distributions/**
      - umlp-tool/build/generated-sources/UMLPWithGUI/**/*.vsix
      - ./**/build/reports/tests/test/**
      - build.log
      - ./**/build/reports/jacoco/**/*.xml
      - docs/gendoc_img
    reports:
      # Lets gitlab render infos about failed tests
      junit: "**/test/**/TEST-*.xml"
      coverage_report:
        coverage_format: jacoco
        path: build/reports/jacoco/testCodeCoverageReport/testCodeCoverageReport.xml
    expire_in: 1 week
  only: # This job is deploying docker-containers... this should _really_ only happen from the `dev` branch
    refs:
      - dev

# Clean build without any cache: an undeclared task input cannot hide behind a cached task result
build_no_build_cache:
  stage: build
  cache: []
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule"
    - if: $CI_PIPELINE_SOURCE == "web"
  before_script:
    # Double the Gradle daemon heap for this job only; the checked-in value stays at 4g.
    - sed -i 's/^org.gradle.jvmargs=.*/org.gradle.jvmargs=-Xmx8192m -Dfile.encoding=UTF-8/' gradle.properties
    - export JAVA_OPTS="-Xmx2g"
  script:
    - export CHROME_BIN=/usr/bin/google-chrome-stable
    - "gradle --version 2>&1 | tee $CI_PROJECT_DIR/build.log"
    - "gradle build --no-build-cache --refresh-dependencies --stacktrace $GRADLE_COMMON_ARGS $GRADLE_OPTS $ARGS1 $ARGS3 >> $CI_PROJECT_DIR/build.log 2> >(tee -a $CI_PROJECT_DIR/build.log >&2)"
    # >(tee -a ...) starts tee background process, wait to ensure everything is written to
    - wait
    - echo "Full log -> $CI_PROJECT_URL/-/jobs/$CI_JOB_ID/artifacts/file/build.log"
  artifacts:
    when: always
    paths:
      - ./**/build/reports/tests/test/**
      - build.log
    reports:
      # Lets gitlab render infos about failed tests
      junit: "**/test/**/TEST-*.xml"
    expire_in: 1 week

check_forbidden_methods:
  stage: check
  script:
    - |
      if grep -R --line-number \
        --include='*.java' \
        --exclude='*GenService.java' \
        '\.isMult[[:space:]]*(' \
        umlp-tool/src/main/java/umlp/generator
      then
        echo "Usage of ASTCDCardinality#isMult found. Use GenService.isList instead."
        exit 1
      else
        echo "No usage of ASTCDCardinality#isMult found."
      fi

slowtest:
  stage: check
  tags:
    - node2-docker-postgres
  services:
    - postgres:12.2-alpine
  variables:
    POSTGRES_DB:  $POSTGRES_DB
    POSTGRES_USER:  $user
    POSTGRES_PASSWORD:  $pass
    POSTGRES_HOST_AUTH_METHOD: trust
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule"
  script:
    - "gradle --version 2>&1 | tee $CI_PROJECT_DIR/build.log"
    - "gradle slowtest --stacktrace $GRADLE_COMMON_ARGS $GRADLE_OPTS $ARGS1 2>&1 | tee -a $CI_PROJECT_DIR/build.log"
  artifacts:
    when: always
    paths:
      - build.log
    reports:
      # Lets gitlab render infos about failed tests
      junit: "**/build/test-results/slowtest/TEST-*.xml"
    expire_in: 1 week

