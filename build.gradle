import com.github.gradle.node.npm.task.NpmInstallTask
import de.montigem.gradle.specific.FrontendCIImageTask
import de.montigem.gradle.specific.FrontendLocalImageTask
import org.gradle.util.GradleVersion

/* (c) https://github.com/MontiCore/monticore */

plugins {
  id 'base'
  id 'de.rwth.se.montigem' // See "umlp-tool/src/main/java/gradle"
  id "io.github.themrmilchmann.ecj" version "0.2.0"
  id "com.github.node-gradle.node" version "5.0.0"
  id "jacoco-report-aggregation"
}

ecj {
    compilerVersion = "3.43.0"
}

// Download node once for all subprojects
node {
  download = true
  version = "${node_version}"
}

def isWindows = System.getProperty("os.name").toLowerCase().startsWith("win")

def getNodeDir() {
  def nodejs_dir = file("${rootDir}/.gradle/nodejs/")
  def node_dir = nodejs_dir.listFiles().find { it.isDirectory() }
  assert node_dir != null: "Can't find node installation"
  return node_dir
}

allprojects {
  apply plugin: 'java'
  java {
    toolchain {
      languageVersion = JavaLanguageVersion.of(21)
    }
  }

  // Force compatible Neo4j Java driver version to prevent NoSuchMethodErrors with Spring Boot 3.5.x
  configurations.all {
    resolutionStrategy.eachDependency { details ->
      if (details.requested.group == 'org.neo4j.driver' && details.requested.name == 'neo4j-java-driver') {
        details.useVersion(neo4j_java_driver_version)
      }
    }
  }
}

subprojects {

  apply plugin: 'io.github.themrmilchmann.ecj'

  ecj {
      compilerVersion = "3.43.0"
  }


    dependencies {
      testRuntimeOnly "org.junit.jupiter:junit-jupiter-engine:$junit_version"
      testRuntimeOnly "org.junit.platform:junit-platform-launcher:$junit_version"
      testImplementation "org.junit.jupiter:junit-jupiter-api:$junit_version"
      testImplementation "org.junit.jupiter:junit-jupiter-params:$junit_version"
  }


  // Use downloaded node for all subprojects
  tasks.withType(NpxTask).configureEach {
    dependsOn rootProject.tasks.named("npmInstall")
    execOverrides {
      if (isWindows) {
        setExecutable "${getNodeDir()}/npx.cmd"
        environment 'PATH', "${getNodeDir()}${System.getProperty('path.separator')}${System.getenv('PATH')}"
      } else {
        setExecutable "${getNodeDir()}/bin/npx"
        environment 'PATH', "${getNodeDir()}/bin${System.getProperty('path.separator')}${System.getenv('PATH')}"
      }
    }
  }

  tasks.withType(NpmTask).configureEach {
    dependsOn rootProject.tasks.named("npmInstall")
    execOverrides {
      if (isWindows) {
        setExecutable "${getNodeDir()}/npm.cmd"
        environment 'PATH', "${getNodeDir()}${System.getProperty('path.separator')}${System.getenv('PATH')}"
      } else {
        setExecutable "${getNodeDir()}/bin/npm"
        environment 'PATH', "${getNodeDir()}/bin${System.getProperty('path.separator')}${System.getenv('PATH')}"
      }
    }
  }

  tasks.withType(NodeTask).configureEach {
    dependsOn rootProject.tasks.named("npmInstall")
    execOverrides {
      if (isWindows) {
        setExecutable "${getNodeDir()}/node.exe"
        environment 'PATH', "${getNodeDir()}${System.getProperty('path.separator')}${System.getenv('PATH')}"
      } else {
        setExecutable "${getNodeDir()}/bin/node"
        environment 'PATH', "${getNodeDir()}/bin${System.getProperty('path.separator')}${System.getenv('PATH')}"
      }
    }
  }

  test {
    useJUnitPlatform {
      if (!project.hasProperty('runBatchLoading')) {
        excludeTags 'BatchLoading'
      }
    }
    testLogging {
      showStandardStreams = false
      events "PASSED", "SKIPPED", "FAILED", "STANDARD_OUT", "STANDARD_ERROR"
    }
  }

  repositories {
    if (("true").equals(getProperty('useLocalRepo'))) {
      mavenLocal()
    }
    maven {
      credentials.username mavenUser
      credentials.password mavenPassword
      url repo
    }
    mavenCentral()
    maven {
      url = "https://repo.gradle.org/gradle/libs-releases/"
    }
  }

  tasks.withType(JavaCompile).configureEach {
    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
    options.encoding = 'UTF-8'
    options.warnings = false
  }

  sourceSets.named("main").configure { main ->
    tasks.named("jar").configure { jar ->
      jar.onlyIf { !main.allSource.files.isEmpty() }
    }
  }

  configurations {
    configureEach {
      if (it.name == "mcTool") return; // Required to allow the MC-Tool (including log4j) to run
      exclude group: 'org.springframework.boot', module: 'spring-boot-starter-logging'
      exclude group: 'ch.qos.logback', module: 'logback-classic'
      exclude group: 'org.apache.logging.log4j', module: 'log4j-to-slf4j'

      resolutionStrategy.eachDependency { details ->
        if (details.requested.group == 'org.neo4j.driver' && details.requested.name == 'neo4j-java-driver') {
          details.useVersion(neo4j_java_driver_version)
          details.because('Ensure compatibility with Spring Boot 3.5.x')
        }
      }
    }
  }

  afterEvaluate {
    tasks.withType(FrontendCIImageTask.class).each {
      it.getFullImageName().set(project.provider {
        String imgBase = Objects.requireNonNull(System.getenv("CI_REGISTRY_IMAGE"), "CI_REGISTRY_IMAGE not set")
        String parentName = project.parent.name
        return imgBase + "/" + parentName + "_frontend:latest"
      })
    }

    tasks.withType(FrontendLocalImageTask.class).each {
      it.getFullImageName().set(getProject().provider(() ->
          (getProject().getParent() != null ? getProject().getParent().getName() : getProject().getName()) + "/frontend"
      ))
    }
  }
  gradle.taskGraph.whenReady {
    it.getAllTasks().findAll { ["distZip", "distTar", "bootDistZip", "bootDistTar"].contains(it.name) }.each { it.enabled = false }
  }
}

project(":umlp-rte:frontend").afterEvaluate { rte ->
  var previousInstallTask = rte.tasks.named("npmInstall")
  var previousUpdateTask

  subprojects {
    tasks.withType(NpmInstallTask).configureEach {
      if (project.path != rte.path) {
        it.mustRunAfter(previousInstallTask);
        previousInstallTask = it
      }
    }

    tasks.withType(NpmTask).configureEach {
      if (name == "npm_update") {
        if (previousUpdateTask) {
          it.mustRunAfter(previousUpdateTask)
        }
        previousUpdateTask = it
      }
    }
  }
}

dependencies{
  jacocoAggregation project(':umlp-jsweet')
  jacocoAggregation "umlp:umlp-tool"
}

reporting {
  reports {
    testCodeCoverageReport(JacocoCoverageReport) {
      if (GradleVersion.current() >= GradleVersion.version("8.13")) {
        testSuiteName = "test"
      } else {
        def TestSuiteType = Class.forName("org.gradle.api.plugins.jvm.TestSuiteType")
        testType = TestSuiteType.UNIT_TEST
      }
    }
  }
}

tasks.named("testCodeCoverageReport"){
  reports{
    xml.required = true
    csv.required = true
    html.required = true
  }

  def originalClassElements = classDirectories.from.toArray()
  def originalSourceElements = sourceDirectories.from.toArray()

  classDirectories.setFrom()

  classDirectories.setFrom(project.provider {
    def allSrcDirs = project.files(originalSourceElements).files

    def handwrittenSrcDir = allSrcDirs.findAll{dir ->
      dir.absolutePath.replace('\\', '/').endsWith("src/main/java")
    }

    def includesList = []
    handwrittenSrcDir.each{srcDir ->
      def javaSources = project.fileTree(dir: srcDir).matching{
        include "**/*.java"
      }

      javaSources.files.each{file ->
        def relPath = srcDir.toPath().relativize(file.toPath()).toString()
        def name = relPath.replaceAll(/\.java$/, '').replace('\\', '/')

        includesList.add("${name}.class")
        includesList.add("${name}\$*.class")
      }
    }

    return project.files(originalClassElements).files.collect { classesDir ->
      project.fileTree(dir: classesDir).matching {
        if (includesList.isEmpty()) {
          exclude "**/*"
        } else {
          include includesList
        }
      }
    }
  })
}

repositories {
  // required to resolve the ecj dependency, including the whole chain of repos to avoid unexpected behaviour
  if (("true").equals(getProperty('useLocalRepo'))) {
    mavenLocal()
  }
  maven {
    credentials.username mavenUser
    credentials.password mavenPassword
    url repo
  }
  mavenCentral()
}

build.dependsOn(gradle.includedBuild("umlp-tool").task(":build"))

