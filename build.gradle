subprojects {
  tasks.configureEach { task ->
    task.doLast {
      def outputFile = new File("${layout.buildDirectory.get().asFile}/artifacts_report/${project.name}_${task.name}.txt")
      outputFile.parentFile.mkdirs() // Ensure the directory exists
      outputFile.text = ""

      outputFile.append("Task: ${task.name}\n")
      outputFile.append("------------Artifacts Input-------------\n")

      // Check if the task has input files and print them
      if (task.inputs.files) {
        task.inputs.files.each { file ->
          outputFile.append("  Input file: $file\n")
        }
      }
      // Check if the task has output files and print them
      outputFile.append("------------Artifacts Output-------------\n")
      if (task.outputs.files) {
        task.outputs.files.each { file ->
          outputFile.append("  Output file: $file\n")
        }
      }
      println "Artifacts Output logged to ${outputFile.absolutePath}"
    }
  }
}

