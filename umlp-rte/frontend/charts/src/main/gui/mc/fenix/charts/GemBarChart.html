<div style="width: 100%; height: 100%; position: relative;">

  <div style="position: absolute; top: 5px; left: 5px; z-index: 10; max-height: 100%; overflow-y: auto;" *ngIf="showConfig">
    <gem-chart-options>
      <li *ngIf="displayLegend === true" style="list-style-type: none;">
        <h3>Legend Position</h3>
        <div class="legendButtons" style="display: flex; column-gap: 10px;">
          <button (click)="setLegendPosition('left')">Left</button>
          <button (click)="setLegendPosition('top')">Top</button>
          <button (click)="setLegendPosition('bottom')">Bottom</button>
          <button (click)="setLegendPosition('right')">Right</button>
        </div>
      </li>
    </gem-chart-options>
  </div>

  <div #outerContainer style="width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; overflow: hidden;">
    <div #innerContainer style="width: 100%; height: 100%; overflow: hidden;">
      <plotly-plot
        [data]="plotlyData"
        [layout]="_layout"
        [config]="_config"
        [useResizeHandler]="true"
        [style]="{width: '100%', height: '100%', display: 'block'}">
      </plotly-plot>
    </div>
  </div>

</div>
