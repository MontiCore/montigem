<div style="position: relative; width: 100%; height: 100%; display: flex; flex-direction: column;">

  <div *ngIf="showConfig" style="position: absolute; top: 0px; left: 0px; z-index: 10;">
    <gem-chart-options>
      <h3>Gauge Chart Settings</h3>
      <div class="settingsMenu">
        <label>
          <input class="numberInput" #minSelector
                 (change)="changeMin(minSelector)"
                 type="number" [value]="_min"
          /> Min Value
        </label>
        <br>
        <label>
          <input class="numberInput" #maxSelector
                 (change)="changeMax(maxSelector)"
                 type="number" [value]="_max"
          /> Max Value
        </label>
        <br>
        <label>
          <input class="textInput" #unitSelector
                 (change)="changeUnit(unitSelector.value)"
                 type="text" [value]="_unit"
          /> Unit
        </label>
      </div>
    </gem-chart-options>
  </div>

  <div *ngIf="_textPosition === 'top' || _textPosition === 'center'" class="external-text-value">
    {{ _textValue }} <span *ngIf="_unit" class="unit-text">{{ _unit }}</span>
  </div>

  <div class="wholeChartContainer" style="flex: 1; min-height: 0; display: flex; flex-direction: row; flex-wrap: wrap; justify-content: space-evenly; align-items: center; gap: 10px; width: 100%;">
    <div *ngFor="let trace of plotlyData" style="flex: 1 1 0; min-width: 150px; height: 100%; min-height: 120px;">
      <plotly-plot [data]="[trace]" [layout]="_layout" [config]="_config"
                   [useResizeHandler]="true"
                   [style]="{width: '100%', height: '100%', display: 'block'}"></plotly-plot>
    </div>
  </div>

  <div *ngIf="_textPosition === 'bottom'" class="external-text-value">
    {{ _textValue }} <span *ngIf="_unit" class="unit-text">{{ _unit }}</span>
  </div>

</div>
