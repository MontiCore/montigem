<div style="width: 100%; height: 100%; position: relative; display: flex; flex-direction: column;">
  <div class="buttons-and-inputs-container" style="display: flex; align-items: center; column-gap: 8px;">
    <gem-chart-options *ngIf="showConfig">
      <li>
        <h3>Chart Style</h3>
        <div class="legendButtons" style="display: flex; column-gap: 10px;">
          <button (click)="setChartStyle('area')">Area</button>
          <button (click)="setChartStyle('line')">Line</button>
        </div>
      </li>
      <li>
        <h3>Legend Position</h3>
        <div class="legendButtons" style="display: flex; column-gap: 10px;">
          <button (click)="setLegendPosition('left')">Left</button>
          <button (click)="setLegendPosition('top')">Top</button>
          <button (click)="setLegendPosition('bottom')">Bottom</button>
          <button (click)="setLegendPosition('right')">Right</button>
        </div>
      </li>
    </gem-chart-options>
    <!-- Button -->
    <button class="toggleLiveDataButton" (click)="toggleLiveData($event)" *ngIf="!isHideLiveDataToggle()">
      {{ getToggleLiveDataButtonLabel() }}
    </button>
  </div>

  <div style="flex: 1; position: relative; min-height: 0;">
    <div #tSChart class="chart-container" style="position: absolute; top: 0; left: 0; right: 0; bottom: 0;"></div>
  </div>
</div>
