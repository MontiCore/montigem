<div style="position: relative; width: 100%; height: 100%;">

  <div *ngIf="showConfig" style="position: absolute; top: 0px; left: 0px; z-index: 10;">
    <gem-chart-options>
      <li>
        <h3>Legend Position</h3>
        <div class="legendButtons">
          <button (click)="setLegendPosition('top')">Top</button>
          <button (click)="setLegendPosition('right')">Right</button>
          <button (click)="setLegendPosition('bottom')">Bottom</button>
          <button (click)="setLegendPosition('left')">Left</button>
        </div>
      </li>
      <li>
        <h3>Box Plot Settings</h3>
        <div class="legendButtons">
          <button (click)="toggleOrientation()">Orientation: {{ _horizontal ? 'Horizontal' : 'Vertical' }}</button>
          <button (click)="toggleDataPoints()">Data Points: {{ _showDataPoints ? 'On' : 'Off' }}</button>
        </div>
      </li>
    </gem-chart-options>
  </div>

  <div #outerContainer class="wholeChartContainer" [ngClass]="changeContainer()" style="width: 100%; height: 100%; display: flex; align-items: center; justify-content: center;">
    <div #innerContainer style="width: 100%; height: 100%;">
      <plotly-plot
        [data]="plotlyData" 
        [layout]="_layout" 
        [config]="_config"
        [useResizeHandler]="true"
        [style]="{width: '100%', height: '100%', display: 'block'}">
      </plotly-plot>
    </div>
  </div>
</div>
