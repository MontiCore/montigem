<div style="width: 100%; height: 100%; position: relative;">

  <div *ngIf="showConfig" style="position: absolute; top: 0px; left: 0px; z-index: 10;">
    <gem-chart-options>
      <li *ngIf="displayLegend === true">
        <h3>Legend Position</h3>
        <div class="legendButtons">
          <button (click)="setLegendPosition('left')">Left</button>
          <button (click)="setLegendPosition('top')">Top</button>
          <button (click)="setLegendPosition('bottom')">Bottom</button>
          <button (click)="setLegendPosition('right')">Right</button>
        </div>
      </li>
    </gem-chart-options>
  </div>

  <div [ngClass]="changeContainer()">
    <div id="network" class="wholeChartContainer"></div>
    <div id="loadingBar">
      <div id="outerBorder" class="outerBorder">
        <div id="text">0%</div>
        <div id="border">
          <div id="bar"></div>
        </div>
      </div>
    </div>
    <gem-chart-legend
      [labels]="legendLabels"
      [colors]="legendColors"
      [displayLegend]="displayLegend"
      >
    </gem-chart-legend>
  </div>

</div>
