<div
  class="gem-dropdown-container"
  (keydown.arrowDown)="focusDown()"
  (keydown.arrowUp)="focusUp()"
  (keydown.enter)="selectWithEnter($event)"
  (keydown.escape)="hideDropdown()"
  (keydown.tab)="tabOut()"
  (keydown)="onKeyPress($event)"
  (keyup)="onKeyRelease($event)"
>
  <label class="gem-label-text-input" [for]="getInputId()">{{ labelText }}</label>

  <div
    class="gem-dropdown-wrapper"
    [ngClass]="{
      'gem-has-error': validity?.getStatus() === 'Error',
      'gem-has-warning': validity?.getStatus() === 'Warning'
    }"
  >
    <button
      class="gem-dropdown-input"
      tabindex="0"
      [id]="getInputId()"
      [disabled]="disabled"
      (click)="toggleDropdown()"
      [matTooltip]="
          validity?.getStatus() === 'Error' || validity?.getStatus() === 'Warning'
            ? validity.getMessage()
            : null
        "
      matTooltipPosition="after"
      [class.gem-dropdown-input-error]="validity?.getStatus() === 'Error'"
      [class.gem-dropdown-input-warning]="validity?.getStatus() === 'Warning'"
    >
      <div class="gem-dropdown-text">{{ selectedOption?.getDisplay() }}</div>
      <mat-icon
        class="gem-dropdown-icon"
        [style.visibility]="filteredOptions?.length > 0 ? 'visible' : 'hidden'"
        [fontIcon]="isContentShown ? 'arrow_drop_up' : 'arrow_drop_down'"
      ></mat-icon>
    </button>
  </div>

  <div *ngIf="isContentShown" class="gem-dropdown-content">
    <div *ngIf="searchEnabled" class="gem-search-input-container">
      <div class="gem-search-icon">
        <mat-icon fontIcon="search"></mat-icon>
      </div>
      <input
        [id]="getSearchInputId()"
        class="gem-text-input gem-search-input"
        type="text"
        placeholder="Search ..."
        tabindex="0"
        autocomplete="off"
        [ngModel]="filterString"
        (ngModelChange)="filterString = $event"
        (keyup)="filterOptions()"
      >
    </div>
    <div [id]="getOptionsId()" class="gem-dropdown-options">
      <div
        *ngFor="let option of filteredOptions; let i = index"
        class="gem-dropdown-option"
        [class.highlight-option]="highlightIdx == i"
        (click)="selectOption(option)"
        (mousemove)="setHighlightIdx(i)"
      >
        {{ option.getDisplay() }}
      </div>
    </div>
  </div>
</div>
