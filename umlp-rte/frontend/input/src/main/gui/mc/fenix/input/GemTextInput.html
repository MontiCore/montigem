<label class="gem-label-text-input" [for]="id + 'Input'">{{ labelText }}</label>
<input
  class="gem-text-input"
  [matTooltip]="
    validity?.getStatus() === 'Error' || validity?.getStatus() === 'Warning'
      ? validity.getMessage()
      : null
  "
  matTooltipPosition="after"
  [gemInputMode]="isNumeric ? 'numeric' : null"
  [class.gem-input-error]="validity?.getStatus() === 'Error'"
  [class.gem-input-warning]="validity?.getStatus() === 'Warning'"
  [type]="inputType"
  [id]="id + 'Input'"
  [ngModel]="displayValue"
  [disabled]="disabled"
  [placeholder]="placeholder"
  [max]="(inputType === 'date' || inputType === 'datetime-local') ? '9999-12-31' + (inputType === 'datetime-local' ? 'T23:59' : '') : null"
  (ngModelChange)="onEntryChange($event)"
  (keyup)="keyRelease.emit($event)"
  (keydown)="keyPress.emit($event)"
  [maxLength] = "maxLength"
/>
