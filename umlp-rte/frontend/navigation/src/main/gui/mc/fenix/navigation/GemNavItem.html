<button
  type="button"
  role="button"
  class="gem-nav-item"
  [ngClass]="{'gem-nav-item-active' : isActive}"
  (click)="navigateOrAct()"
>
  <mat-icon *ngIf="iconName" class="gem-nav-item-icon" [fontIcon]="iconName"></mat-icon>
  <span *ngIf="title" class="gem-nav-item-title">{{title}}</span>
  <ng-container *ngIf="component">
    <ng-container *ngTemplateOutlet="component"></ng-container>
  </ng-container>
</button>
