<button
  type="button"
  class="gem-button"
  [class.gem-button-active]="isActive()"
  [attr.aria-current]="isActive() ? 'true' : null"
  [attr.aria-label]="getAriaLabel() || null"
  [disabled]="isDisabled() ? 'disabled' : null"
  (click)="getLeftClick()()"
>
  <ng-container *ngIf="content">
    <ng-container *ngFor="let c of content">
      <ng-container *ngTemplateOutlet="c"></ng-container>
    </ng-container>
  </ng-container>
  <ng-container *ngIf="!content">
    {{ _label }}
  </ng-container>
</button>
