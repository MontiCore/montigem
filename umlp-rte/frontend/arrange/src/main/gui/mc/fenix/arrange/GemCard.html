<gem-column
  class="gem-card"
  [components]="[gemNode2, gemNodeCollapse]"
>
</gem-column>
<ng-template #gemNode2>
  <gem-row
    height="initial"
    class="gem-card-header"
    [class.collapsible]="collapsible"
    [class.gem-card-collapsed]="collapsible && isCollapsed"
    (click)="collapsible && toggleCollapse()"
    [component]="titleTpl"
  >
  </gem-row>
</ng-template>
<ng-template #gemNodeCollapse>
  <div
    class="gem-card-collapse-wrapper"
    [class.gem-card-collapsed]="collapsible && isCollapsed"
  >
    <div class="gem-card-collapse-inner">
      <hr class="gem-card-line">
      <gem-column
        height="initial"
        class="gem-card-body"
        [component]="component"
      >
      </gem-column>
    </div>
  </div>
</ng-template>
<ng-template #titleTpl>
  <div class="gem-card-header-content">
    <mat-icon
      *ngIf="collapsible"
      class="gem-card-collapse-icon"
      [class.gem-card-collapsed]="isCollapsed"
      fontIcon="expand_more"
    ></mat-icon>
    <div class="gem-card-title-content">
      <ng-template [ngIf]="!titleComponent">
        {{title}}
      </ng-template>
      <ng-template [ngIf]="titleComponent">
        <ng-template [ngTemplateOutlet]="titleComponent">
        </ng-template>
      </ng-template>
    </div>
  </div>
</ng-template>
