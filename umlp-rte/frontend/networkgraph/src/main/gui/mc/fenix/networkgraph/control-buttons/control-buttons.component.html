<div [attr.layout]="layout" class="control-buttons-wrapper">
  <!-- Draw the buttons horizontally or vertically using flexbox and simple buttons -->
  <ng-container *ngIf="isVerticalOrHorizontalLayout">
    <ng-container *ngFor="let button of controlButtons; trackBy: trackByIdx">
      <button
        type="button"
        class="graph-icon-button graph-icon-button--rounded graph-icon-button--raised"
        (click)="handleButtonClick(button)"
        [graphTooltip]="button.tooltip"
        [graphTooltipOptions]="button.tooltipOptions"
      >
        <span class="graph-icon-button-icon" [ngClass]="button.icon"></span>
      </button>
    </ng-container>
  </ng-container>

  <!-- Use a Speed-Dial to show all buttons -->
  <ng-container *ngIf="isSpeedDialLayout">
    <graph-speed-dial
      (click)="handleClick()"
      [buttonClassName]="speedDialConfig?.buttonClassName ?? ''"
      [className]="speedDialConfig?.className ?? ''"
      [direction]="speedDialConfig?.direction ?? 'up-right'"
      [hideIcon]="speedDialConfig?.hideIcon"
      [hideOnClickOutside]="speedDialConfig?.hideOnClickOutside ?? false"
      [model]="speedDialItems"
      [radius]="computedRadius"
      [rotateAnimation]="speedDialConfig?.rotateAnimation ?? true"
      [showIcon]="speedDialConfig?.showIcon"
      [transitionDelay]="speedDialConfig?.transitionDelay ?? 30"
      [type]="speedDialConfig?.type ?? 'quarter-circle'"
      [visible]="speedDialConfig?.visible ?? false"
      ariaLabel="Open the Network Control Buttons">
    </graph-speed-dial>
  </ng-container>
</div>
