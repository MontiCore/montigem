<!-- Information Button -->
<button
  type="button"
  class="graph-icon-button graph-icon-button--rounded"
  (click)="toggleOverlayPanel(overlayPanel, $event)"
  [graphTooltip]="'Show Information'"
  [graphTooltipOptions]="tooltipOptions"
  aria-label="Show Information">
  <span class="graph-icon-button-icon pi pi-info"></span>
</button>

<!-- Dynamic Panel -->
<graph-popover #overlayPanel (panelShow)="updateMetricInformation()" styleClass="metricsOverlayPanel">
  <ng-container *ngIf="metricInformation | objectKeys as metricKeys">
    <table *ngIf="metricKeys.length" class="metrics-table">
      <thead>
        <tr>
          <th>Metric</th>
          <th>Value</th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let key of metricKeys; trackBy: trackByIndex">
          <td>{{ key }}</td>
          <td>{{ metricInformation[key] | formatValue }}</td>
        </tr>
      </tbody>
    </table>

    <div *ngIf="!metricKeys.length">No metrics to show.</div>
  </ng-container>
</graph-popover>
