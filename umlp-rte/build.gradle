import de.montigem.gradle.specific.Java2TSTask

plugins {
  id 'de.rwth.se.montigem-module' // create models-jar
}

// configure deployment
publishing {
  publications {
    maven(MavenPublication) {
      from(components.java)
    }
  }
  repositories.maven {
    if (project.hasProperty('mavenUser') && project.hasProperty('mavenPassword')) {
      credentials.username mavenUser
      credentials.password mavenPassword
    }

    def releasesRepoUrl = "https://nexus.se.rwth-aachen.de/content/repositories/umlp-releases/"
    def snapshotsRepoUrl = "https://nexus.se.rwth-aachen.de/content/repositories/umlp-snapshots/"
    url = version.endsWith("SNAPSHOT") ? snapshotsRepoUrl : releasesRepoUrl
  }
}

configurations {
  jsweettranspilerRuntime {
    extendsFrom(configurations.compileClasspath)
  }
}

dependencies {
  jsweettranspilerRuntime project(path: ":umlp-jsweet")
}

tasks.register("transpileRuntime", Java2TSTask) {
  getInput().setFrom(sourceSets.main.java)
  getVerbose().set(true)
  getOutputDir().set(project.layout.buildDirectory.dir("runtimeTS"))
  getJSweetClassPath().from(configurations.jsweettranspilerRuntime)
  // getDomainModel().set("NYI")
  getExcludeSource().add("glob:**/shellapi/*.java")
  getExcludeSource().add("glob:**/test_infrastructure/*.java")
  getExcludeSource().add("glob:**/common/DatabaseAccessManage*.java")
  getExcludeSource().add("glob:**/common/Neo4jDatabaseStarter.java")
  getExcludeSource().add("glob:**/common/GemIdManager4*.java")
  getExcludeSource().add("glob:**/service/**.java")
  getExcludeSource().add("glob:**/service2/**.java")
}

// END Transpile runtime
