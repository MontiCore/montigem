plugins {
  id 'java-library'
  // id 'io.spring.dependency-management' version '1.0.15.RELEASE''
  id 'maven-publish'
}

tasks.withType(Jar).configureEach {
  archiveBaseName.set("umlp-rte-backend")
}

dependencies {
  api group: 'de.monticore', name: 'monticore-runtime', version: mc_version

  implementation group: 'org.springframework.boot', name: 'spring-boot-starter-websocket', version: spring_version
  implementation group: 'org.springframework.shell', name: 'spring-shell-starter', version: spring_shell_version
  implementation group: 'org.springframework.boot', name: 'spring-boot-starter-webflux', version: spring_version
  // MUST be an API dependency, as the exposed OCL2SQL implements SetExpressionsVisitor2
  api group: 'de.monticore.lang', name: 'ocl', version: mc_version

  // Compile only, such that we don't force the neo4j dependency into each product
  // Problems with apache commons-text and MontiCore JSON Parser
  compileOnly "org.neo4j.test:neo4j-harness:$neo4j_embedded_test" exclude module: "commons-text"
  implementation group: 'org.neo4j.driver', name: 'neo4j-java-driver', version: "$neo4j_java_driver_version"
  implementation("io.undertow:undertow-core:2.3.20.Final")

  // Used for umlp._infrastructure.TestSetup
  // Alternative: testing-rte + generate a testing module for each cd
  compileOnly "org.junit.jupiter:junit-jupiter:$junit_version" // depend on not only the api, as otherwise spring-boot-starter-test destroys everything
  // Used for AbstractPlaywrightE2ETest
  compileOnly 'com.microsoft.playwright:playwright:1.44.0'
  compileOnly group: 'org.springframework.boot', name: 'spring-boot-starter-test', version: spring_version

  implementation group: 'com.zaxxer', name: 'HikariCP', version: "7.0.2"

  compileOnly("com.hivemq:hivemq-mqtt-client:1.3.0")

  compileOnly group: 'org.jsweet', name: 'jsweet-core', version: "6.3.0"
}

publishing {
  publications {
    maven(MavenPublication) {
      from(components.java)
    }
  }
  repositories.maven {
    if (project.hasProperty('mavenUser') && project.hasProperty('mavenPassword')) {
      credentials.username mavenUser
      credentials.password mavenPassword
    }

    def releasesRepoUrl = "https://nexus.se.rwth-aachen.de/content/repositories/umlp-releases/"
    def snapshotsRepoUrl = "https://nexus.se.rwth-aachen.de/content/repositories/umlp-snapshots/"
    url = version.endsWith("SNAPSHOT") ? snapshotsRepoUrl : releasesRepoUrl
  }
}
