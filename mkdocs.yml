site_name: MontiGem
use_directory_urls: false

theme:
  name: 'material'
  custom_dir: docs/overrides
  hide:
    - navigation
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.footer
    - navigation.instant
    - navigation.instant.progress
    - navigation.indexes
    - toc.follow
    - content.tabs.link
    - social
    - content.code.copy
    - content.code.annotate
    - toc.integrate
  theme:
    pallete:
      primary: custom
      accent: custom
  favicon: 'img/Gem.svg'
  logo: 'img/Gem_white.svg'

extra_css:
  - stylesheets/extra.css


site_url: https://monticore.pages.rwth-aachen.de/monticore/umlp

copyright: '(c) https://github.com/MontiCore/monticore'

markdown_extensions:
  - def_list
  - attr_list
  - md_in_html
  - admonition
  - footnotes
  - pymdownx.blocks.caption
  - pymdownx.extra
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.highlight
  - pymdownx.inlinehilite
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.snippets
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.progressbar
  - toc

nav:
  - Home: 'index.md'
  - Tutorial:
    - Introduction: 'Tutorial.md'
    - Prerequisites: 'tutorial/00_Prerequisites.md'
    - Class Diagram Basics: 'tutorial/01_ClassDiagramBasics.md'
    - GUI Basics: 'tutorial/02_GUIBasics.md'
    - TOP Mechanism: 'tutorial/03_TOPMechanism.md'
    - Customizing: 'tutorial/04_Customizing.md'
    - Adding Services to Class Diagrams: 'tutorial/05_ClassDiagramAdvanced.md'
    - Adding Functions in GUI: 'tutorial/06_GUIAdvanced1.md'
    - Updating Objects: 'tutorial/07_GUIAdvanced2.md'
    - GUI Layout: 'tutorial/08_GUIAdvanced3.md'
    - Charts Frontend: 'tutorial/09_GUIAdvanced4.md'
    - Charts Backend: 'tutorial/10_GUIAdvanced5.md'
    - E2E Testing (simulated GUI): 'tutorial/11_E2ETestingWithSimulatedGUI.md'
    - OCL GUI Validity Checking: 'tutorial/12_OCLGUIValidityChecking.md'
  - GUI Component Library: 'gendoc_components/Frontend-RTE.md'
  - Changelog: 'CHANGELOGHANGELOG'
  - More Documentation:
    - Helpful Links: 'HelpfulLinks.md'
    - GUI Validity Generator Internals: 'GUIValidityDev.md'
  - License: http://monticore.github.io/monticore/00.org/Licenses/LICENSE-MONTICORE-3-LEVEL/
