<div class="image-scroller" *ngIf="imagesApiUrl">

  <!-- Category jump-list -->
  <div class="category-bar" *ngIf="getUniqueCategories().length > 0">
    <span class="category-bar-label">Jump to:</span>
    <div class="category-chips">
      <button
        *ngFor="let cat of getUniqueCategories()"
        class="category-chip"
        [class.active]="isCategoryOnCurrentPage(cat)"
        (click)="jumpToCategory(cat)"
        [title]="cat"
      >{{ getCategoryLabel(cat) }}</button>
    </div>
  </div>

  <!-- Pagination header -->
  <div class="scroller-header">
    <button class="nav-btn" (click)="onPrevPage()" [disabled]="isFirstPage()">&#8592; Prev</button>
    <span class="page-info">
      Page {{ getDisplayPage() }} / {{ getTotalPages() }}
      &nbsp;&mdash;&nbsp;
      {{ allImages.length }} images total
    </span>
    <button class="nav-btn" (click)="onNextPage()" [disabled]="isLastPage()">Next &#8594;</button>
  </div>

  <!-- Image preview grid -->
  <div class="image-grid">
    <div
      *ngFor="let name of getCurrentPageImages()"
      class="image-item"
      (click)="onSelectImage(getFullImageUrl(name))"
      [title]="name"
    >
      <img
        [src]="getFullImageUrl(name)"
        [alt]="name"
        class="image-thumb"
        draggable="false"
      />
      <span class="image-label">{{ getCategoryLabel(getCategoryFromPath(name)) }}</span>
    </div>
  </div>

</div>

<div class="scroller-empty" *ngIf="!imagesApiUrl">
  No images API URL configured.
</div>
