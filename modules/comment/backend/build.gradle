plugins {
  id 'de.rwth.se.montigem-backend'
  id 'java-library'

  // id 'io.spring.dependency-management' version '1.0.15.RELEASE''
  id 'org.springframework.boot' version "${spring_version}"
  id 'maven-publish'
}

dependencies {
  implementation project(':umlp-rte')
  api group: 'org.springframework.boot', name: 'spring-boot-starter-security', version: spring_version
  implementation 'com.h2database:h2:2.1.214'
}

publishing {
  publications {
    mavenJava(MavenPublication) {
      from components.java
    }
  }
  // TODO: correct repo
  repositories {
    maven {
      url "file://${project.layout.buildDirectory.get().asFile}/repo"
    }
    maven {
      if (project.hasProperty('mavenUser') && project.hasProperty('mavenPassword')) {
        credentials.username mavenUser
        credentials.password mavenPassword
      }

      def releasesRepoUrl = "https://nexus.se.rwth-aachen.de/content/repositories/umlp-releases/"
      def snapshotsRepoUrl = "https://nexus.se.rwth-aachen.de/content/repositories/umlp-snapshots/"
      url = version.endsWith("SNAPSHOT") ? snapshotsRepoUrl : releasesRepoUrl
    }
  }
}
