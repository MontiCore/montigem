import de.montigem.gradle.MGBasePlugin
import de.montigem.gradle.specific.GUI2JavaTask
import de.montigem.gradle.specific.UMLP2TSTask

plugins {
  id 'de.rwth.se.montigem-module-frontend'
}

montigem {
  libs.addAll([project(":modules:dashboard:frontend:dashboard")])
}

// The lib tasks are registered by the plugin after evaluation
afterEvaluate {
  def lib = project(":modules:dashboard:frontend:dashboard")
  lib.tasks.named("gui2java", GUI2JavaTask) {
    guiCreateModels = ["dashboardcomponents.CellDialog"]
  }
  // The domain model imports the chart types (e.g., GemPieChartData) of the RTE
  lib.tasks.named("umlp2ts", UMLP2TSTask) {
    symbolPath.from(lib.configurations.named(MGBasePlugin.MONTIGEM_MODULE_GUI_SYMBOLS_CONFIG))
  }
}

// Publish the GUI symbols and the import map of the module (umlp.modules:dashboard depends on them)
publishing {
  publications {
    mavenJava(MavenPublication) {
      from components.java
    }
  }
}
